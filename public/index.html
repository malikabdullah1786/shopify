<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Customizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    #customizer-container {
      border: 1px solid #ccc;
      padding: 20px;
      margin: 20px 0;
      max-width: 500px;
    }
    #preview-canvas {
      width: 300px;
      height: 300px;
      border: 1px solid #000;
      position: relative;
      background-color: #f0f0f0;
      overflow: hidden; /* Ensures elements don't go outside the canvas */
    }
    #preview-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-family: Arial, sans-serif;
      white-space: pre-wrap; /* Allows text to wrap */
      text-align: center;
      width: 100%;
    }
    #preview-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Stretches image to fill the container */
    }
    .customizer-controls {
        margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- This container will be injected onto the Shopify product page -->
  <div id="customizer-container">
    <h2>Customize Your Product</h2>

    <div id="preview-canvas">
      <img id="preview-image" src="" alt="">
      <div id="preview-text"></div>
    </div>

    <div class="customizer-controls">
      <div>
        <label for="text-input">Add Text:</label>
        <input type="text" id="text-input" placeholder="Enter your text">
      </div>
      <div>
        <label for="image-upload">Upload Image:</label>
        <input type="file" id="image-upload" accept="image/*">
      </div>
    </div>

    <button id="add-to-cart">Add to Cart</button>
  </div>

  <script src="customizer.js"></script>
</body>
</html>
